# fly launch --no-deploy && fly secrets set LI_AT=... LI_JSESSIONID=... && fly deploy
app = "linkedin-profile-api"
primary_region = "sin"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # keep one machine warm: no cold start for a reviewer
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    strict-transport-security = "max-age=31536000"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
