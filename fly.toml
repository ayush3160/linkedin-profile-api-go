# fly apps create <name> && fly secrets set LI_AT=... LI_JSESSIONID=... && fly deploy
#
# Do NOT use `fly launch` on this file: it rewrites internal_port to its own
# guess (8080) while the binary listens on $PORT (8000), which deploys a
# machine the proxy cannot reach -- health checks go critical with
# "connect: connection refused".
app = "linkedin-profile-api-go"
primary_region = "sin"   # closest region to India; Fly has no bom

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # keep one machine warm: no cold start for a reviewer
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    strict-transport-security = "max-age=31536000"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
