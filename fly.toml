# fly.toml app configuration file generated for linkedin-profile-api-go on 2026-08-29T07:45:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'linkedin-profile-api-go'
primary_region = 'ams'

[build]

[env]
  PORT = '8000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    [http_service.http_options.response]
      [http_service.http_options.response.headers]
        strict-transport-security = 'max-age=31536000'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
