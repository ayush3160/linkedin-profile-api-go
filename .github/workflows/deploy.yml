name: Deploy

# Deploys to Fly on every merge to main, but only once CI has gone green --
# a broken build should never replace a running deployment.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test /health
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          url="https://$app.fly.dev/health"
          echo "probing $url"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$url" | tee /dev/stderr | jq -e '.status == "ok"' >/dev/null; then
              echo "healthy"; exit 0
            fi
            echo "attempt $attempt failed, retrying"; sleep 10
          done
          echo "deployment did not become healthy"; exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
